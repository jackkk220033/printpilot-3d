<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bon d’envoi Boutique — JJ3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#e6e8ef;color:#19213a;font:15px/1.5 system-ui,Arial,sans-serif}main{max-width:800px;margin:30px auto;padding:40px;background:white;box-shadow:0 8px 30px #0002}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.logo{width:106px;height:106px;object-fit:contain}.brand{display:flex;gap:12px;align-items:center}.muted{color:#68738b}.divider{height:3px;background:#7135c4;margin:22px 0}.cols{display:flex;justify-content:space-between;gap:30px}.cols>div{flex:1;white-space:pre-line}table{border-collapse:collapse;width:100%;margin:26px 0}th{background:#eae6f8;text-align:left}th,td{padding:10px;border-bottom:1px solid #dde2ef}.sum{margin-left:auto;max-width:330px}.sum div{display:flex;justify-content:space-between;padding:4px 0}.notes{white-space:pre-line;margin-top:22px}.toolbar{padding:12px;text-align:center;background:#141f35;color:white}.toolbar button{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#995afa;color:#fff;font-weight:bold}small{color:#56627a}@page{size:letter;margin:13mm}@media print{body{background:white}main{padding:0;margin:0;max-width:none;box-shadow:none}.toolbar{display:none}th{background:#eae6f8!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><div class="toolbar">Choisis « Enregistrer au format PDF » dans la fenêtre d’impression. <button onclick="window.print()">📦 Imprimer / Enregistrer en PDF</button></div><main id="slip-root">Chargement du bon d’envoi…</main><script>
(function(){'use strict';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');let data;try{data=JSON.parse(localStorage.getItem('printpilot-excel-extras-v1')||'{}');}catch(_){data={};}const slip=(data.stockSlips||[]).find(x=>x.id===id);const root=document.getElementById('slip-root');if(!slip){root.innerHTML='<h2>Bon d’envoi introuvable sur cet appareil</h2><p>Ouvre-le depuis l’application JJ3D après synchronisation Firebase.</p>';return;}const cfg=data.invoiceSettings||{};const sum=(slip.lines||[]).reduce((a,l)=>a+(Number(l.qty)||0),0);root.innerHTML=`<div class="top"><div class="brand"><img class="logo" src="icons/splash-logo.png" alt="JJ3D"><div><h1 style="margin:0">${e(cfg.business||'JJ3D')}</h1><div class="muted">Impression 3D · Créations personnalisées</div></div></div><div><h1>BON D’ENVOI</h1><b>${e(slip.number)}</b><div>${e(slip.date)}</div></div></div><div class="divider"></div><div class="cols"><div><b>Émis par</b><div>${e(cfg.business||'JJ3D')}<br>${e(cfg.address||'').replaceAll('
','<br>')}<br>${e(cfg.email||'')}</div></div><div><b>Destination</b><div>${e(slip.destination||'Boutique')}<br>${e(slip.contact||'')}<br>${e(slip.address||'').replaceAll('
','<br>')}</div></div></div><p><b>Document :</b> Transfert / réapprovisionnement de stock boutique</p><table><thead><tr><th># stock</th><th>ID produit</th><th>Description</th><th>Quantité</th></tr></thead><tbody>${(slip.lines||[]).map(l=>`<tr><td>${e(l.shopId||'')}</td><td>${e(l.id||'')}</td><td>${e(l.name||'')}</td><td>${e(l.qty||'')}</td></tr>`).join('')}</tbody></table><div class="sum"><div><span>Total d’articles envoyés</span><b>${e(sum)}</b></div></div>${slip.notes?`<div class="notes"><b>Notes</b><p>${e(slip.notes)}</p></div>`:''}<p style="margin-top:45px;text-align:center;color:#6846a0">JJ3D — Suivi de stock boutique 💜</p>`;})();
</script></body></html>
