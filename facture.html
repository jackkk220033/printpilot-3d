<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facture — JJ3D v4.11.44</title><style>
*{box-sizing:border-box}body{margin:0;background:#e6e8ef;color:#19213a;font:15px/1.5 system-ui,Arial,sans-serif}main{max-width:800px;margin:30px auto;padding:40px;background:white;box-shadow:0 8px 30px #0002}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.logo{width:106px;height:106px;object-fit:contain}.brand{display:flex;gap:12px;align-items:center}.muted{color:#68738b}.divider{height:3px;background:#7135c4;margin:22px 0}.cols{display:flex;justify-content:space-between;gap:30px}.cols>div{flex:1;white-space:pre-line}table{border-collapse:collapse;width:100%;margin:26px 0}th{background:#eae6f8;text-align:left}th,td{padding:10px;border-bottom:1px solid #dde2ef}td:last-child,th:last-child{text-align:right}.sum{margin-left:auto;max-width:330px}.sum div{display:flex;justify-content:space-between;padding:4px 0}.sum .total{border-top:2px solid #7135c4;font-size:20px;font-weight:700;margin-top:10px;padding-top:10px}.notes{white-space:pre-line;margin-top:22px}.toolbar{padding:12px;text-align:center;background:#141f35;color:white}.toolbar button{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#995afa;color:#fff;font-weight:bold}main{position:relative;isolation:isolate}.watermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-28deg);font-family:Arial,Helvetica,sans-serif;font-size:clamp(68px,12vw,130px);font-weight:900;letter-spacing:9px;color:rgba(188,26,38,.45);border:9px solid rgba(188,26,38,.45);padding:12px 34px;border-radius:18px;pointer-events:none;display:none;text-transform:uppercase;white-space:nowrap;z-index:9999;text-shadow:0 1px 1px #fff8}small{color:#56627a}@page{size:letter;margin:13mm}@media print{body{background:white}.watermark{position:absolute;left:50%;top:50%;font-size:110px;color:rgba(188,26,38,.45)!important;border-color:rgba(188,26,38,.45)!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}main{padding:0;margin:0;max-width:none;box-shadow:none}.toolbar{display:none}th{background:#eae6f8!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><div class="toolbar">Choisis « Enregistrer au format PDF » dans la fenêtre d’impression. <button onclick="window.print()">🧾 Imprimer / Enregistrer en PDF</button></div><div class="watermark" id="paid-watermark">PAYÉ</div><main id="invoice-root">Chargement de la facture…</main><script>
(function(){'use strict';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const m=n=>(Number(n)||0).toLocaleString('fr-CA',{style:'currency',currency:'CAD'});const id=new URLSearchParams(location.search).get('id');let data;try{data=JSON.parse(localStorage.getItem('printpilot-excel-extras-v1')||'{}');}catch(_){data={};}const inv=(data.invoices||[]).find(x=>x.id===id);const root=document.getElementById('invoice-root');if(!inv){root.innerHTML='<h2>Facture introuvable sur cet appareil</h2><p>Ouvre la facture depuis l’application JJ3D après synchronisation Firebase.</p>';return;}const cfg=data.invoiceSettings||{};const wm=document.getElementById('paid-watermark');if(String(inv.status||'').trim().toLowerCase()==='paid'&&wm){wm.style.display='block';wm.setAttribute('aria-label','Facture payée');}const sum=(inv.lines||[]).reduce((a,l)=>a+(Number(l.qty)||0)*(Number(l.price)||0),0);const discount=Math.min(sum,Number(inv.discount)||0);const ship=Number(inv.shipping)||0;const base=sum-discount+ship;const tax=base*(Number(inv.taxRate)||0)/100;const total=base+tax;root.innerHTML=`<div class="top"><div class="brand"><img class="logo" src="icons/splash-logo.png" alt="JJ3D"><div><h1 style="margin:0">${e(cfg.business||'JJ3D')}</h1><div class="muted">Impression 3D · Créations personnalisées</div></div></div><div><h1>FACTURE</h1><b>${e(inv.number)}</b><div>${e(inv.date)}</div></div></div><div class="divider"></div><div class="cols"><div><b>Émise par</b><div>${e(cfg.business||'JJ3D')}<br>${e(cfg.address||'').replaceAll('\n','<br>')}<br>${e(cfg.email||'')}<br>${e(cfg.taxNumbers||'')}</div></div><div><b>Facturé à</b><div>${e(inv.clientName)}<br>${e(inv.clientAddress||'').replaceAll('\n','<br>')}<br>${e(inv.clientEmail)}</div></div></div><p><b>Échéance :</b> ${e(inv.due)} &nbsp;&nbsp; ${inv.status==='paid'&&inv.paidDate?`<b>Payée le :</b> ${e(inv.paidDate)} &nbsp;&nbsp;`:''}${inv.status==='paid'&&inv.paymentMethod?`<b>Paiement :</b> ${e(inv.paymentMethod)} &nbsp;&nbsp;`:''}<b>Statut :</b> ${e(({draft:'Brouillon',sent:'Envoyée',paid:'Payée',cancelled:'Annulée'})[inv.status]||'Brouillon')}</p><table><thead><tr><th>Description</th><th>Quantité</th><th>Prix unitaire</th><th>Montant</th></tr></thead><tbody>${(inv.lines||[]).map(l=>`<tr><td>${e(l.name)}</td><td>${e(l.qty)}</td><td>${m(l.price)}</td><td>${m(Number(l.qty)*Number(l.price))}</td></tr>`).join('')}</tbody></table><div class="sum"><div><span>Sous-total</span><b>${m(sum)}</b></div>${discount?`<div><span>Rabais</span><b>− ${m(discount)}</b></div>`:''}<div><span>Livraison</span><b>${m(ship)}</b></div>${Number(inv.taxRate)?`<div><span>Taxes (${e(inv.taxRate)} %)</span><b>${m(tax)}</b></div>`:''}<div class="total"><span>Total CAD</span><strong>${m(total)}</strong></div></div>${inv.notes?`<div class="notes"><b>Notes</b><p>${e(inv.notes)}</p></div>`:''}${cfg.payment?`<div class="notes"><b>Modalités de paiement</b><p>${e(cfg.payment)}</p></div>`:''}<p style="margin-top:45px;text-align:center;color:#6846a0">Merci d'encourager JJ3D 💜</p>`;if(wm&&inv.status==='paid')root.prepend(wm);})();
</script></body></html>
